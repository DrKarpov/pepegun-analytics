name: Code verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/snapshot.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/snapshot.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check module syntax and fixed-snapshot regressions
        run: |
          for f in docs/*.mjs scripts/*.mjs tests/*.mjs; do node --check "$f"; done
          node tests/analytics.test.mjs
          node tests/insights.test.mjs
          node tests/integrity.test.mjs
          node tests/snapshot.test.mjs
      - name: Verify live provider samples (read-only)
        run: node scripts/check-providers.mjs
      - name: Diagnose full provider history (read-only)
        run: node scripts/check-full-history.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium webkit
      - name: Verify dashboard in Chromium and WebKit
        run: node tests/p1-browser.test.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
