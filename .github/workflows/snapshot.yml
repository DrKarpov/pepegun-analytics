name: Refresh public history snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot.yml'
      - 'scripts/snapshot.mjs'
      - 'docs/analytics.mjs'

permissions:
  contents: write

concurrency:
  group: public-history-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify and generate history
        run: |
          node tests/analytics.test.mjs
          node tests/insights.test.mjs
          node tests/integrity.test.mjs
          node scripts/snapshot.mjs
          node tests/snapshot.test.mjs
      - name: Publish verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public history snapshot"
          # No force push. If main moved, retry on its latest code and data instead
          # of rebasing an older generated snapshot over a newer one.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git fetch origin main
            git checkout --detach origin/main
            node tests/analytics.test.mjs
            node tests/insights.test.mjs
            node tests/integrity.test.mjs
            node scripts/snapshot.mjs
            node tests/snapshot.test.mjs
            git add docs/snapshot.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh public history snapshot"
          done
