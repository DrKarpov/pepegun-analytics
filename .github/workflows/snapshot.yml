name: Refresh public history snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    paths:
      - '.github/workflows/snapshot.yml'
      - 'scripts/snapshot.mjs'
      - 'docs/*.mjs'
      - 'tests/*.mjs'

permissions:
  contents: write

concurrency:
  group: public-history-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify and generate history
        run: |
          node tests/analytics.test.mjs
          node tests/insights.test.mjs
          node scripts/snapshot.mjs
          node tests/snapshot.test.mjs
      - name: Publish verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public history snapshot"
          git push origin HEAD:main
